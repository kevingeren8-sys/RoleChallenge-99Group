server:
  address: 127.0.0.1
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:users;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
